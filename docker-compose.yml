services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargolens
      POSTGRES_USER: cargolens
      POSTGRES_PASSWORD: cargolens_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://cargolens:cargolens_dev@db:5432/cargolens
      JWT_SECRET: change-this-in-production
    ports: ["8000:8000"]
    volumes: ["./backend:/app","./sample_data:/app/sample_data"]
    depends_on: [db]
  frontend:
    build: ./frontend
    command: npm run dev
    environment: ["NEXT_PUBLIC_API_URL=http://localhost:8000/api"]
    ports: ["3000:3000"]
    volumes: ["./frontend:/app","/app/node_modules"]
    depends_on: [backend]
volumes: {postgres_data: {}}
